<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>수업 신청함 · 관리자</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #fff8ee; --surface: #ffffff; --surface-2: #f6ecdc; --ink: #3a2119; --muted: #6b5148;
  --accent: #d81b5c; --accent-ink: #fff; --new: #d81b5c; --done: #4f7a1f;
  --font: "Gothic A1", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
}
[hidden] { display: none !important; }
* { box-sizing: border-box; }
body { margin: 0; font-family: var(--font); font-size: 16px; line-height: 1.5; background: var(--bg); color: var(--ink); word-break: keep-all; }
button, input { font: inherit; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.wrap { max-width: 720px; margin: 0 auto; padding: 20px 16px 64px; }
h1 { font-size: 1.5rem; font-weight: 800; margin: 8px 0 20px; }
.btn { min-height: 48px; padding: 0 20px; border: 0; border-radius: 999px; background: var(--accent); color: var(--accent-ink); font-weight: 800; cursor: pointer; }
.btn.quiet { background: var(--surface-2); color: var(--ink); }

/* Sign in */
.login { display: grid; gap: 12px; max-width: 360px; margin-top: 12vh; }
.login label { font-weight: 600; }
.login input { min-height: 52px; padding: 0 14px; border: 2px solid #d9c6b4; border-radius: 10px; background: var(--surface); font-size: 18px; }
.err { color: var(--accent); font-weight: 600; min-height: 1.5em; }

/* Inbox */
.bar { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.count { background: var(--surface); border-radius: 14px; padding: 18px 20px; margin-bottom: 16px; }
.count strong { display: block; font-size: 3rem; font-weight: 800; line-height: 1; color: var(--new); }
.filters { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
.filters button { min-height: 44px; padding: 0 16px; border: 0; border-radius: 999px; background: var(--surface-2); color: var(--ink); font-weight: 600; cursor: pointer; }
.filters button[aria-pressed="true"] { background: var(--ink); color: #fff; }
.list { display: grid; gap: 12px; padding: 0; margin: 0; list-style: none; }
.card { background: var(--surface); border-radius: 14px; padding: 16px 18px; }
.card.is-new { box-shadow: inset 4px 0 0 var(--new); }
.card .when { color: var(--muted); font-size: 14px; }
.card .who { font-size: 1.25rem; font-weight: 800; margin: 2px 0; }
.card .contact { display: inline-flex; align-items: center; min-height: 44px; padding: 0 12px; margin: 4px 0; border: 0; border-radius: 10px; background: var(--surface-2); color: var(--ink); font-size: 1.0625rem; font-weight: 600; cursor: pointer; }
.card .date { margin: 6px 0 10px; }
.card .date b { font-weight: 600; }
.states { display: flex; gap: 6px; flex-wrap: wrap; }
.states button { min-height: 44px; padding: 0 14px; border: 0; border-radius: 999px; background: var(--surface-2); color: var(--ink); font-weight: 600; cursor: pointer; }
.states button[aria-pressed="true"] { background: var(--ink); color: #fff; }
.empty { background: var(--surface); border-radius: 14px; padding: 24px; color: var(--muted); }
.toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); background: var(--ink); color: #fff; padding: 12px 18px; border-radius: 999px; font-weight: 600; }
</style>
</head>
<body>
<main class="wrap">
  <section id="login-view">
    <h1>수업 신청함</h1>
    <form class="login" id="login-form">
      <label for="pw">관리자 비밀번호</label>
      <input id="pw" type="password" autocomplete="current-password" required>
      <button class="btn" type="submit">열기</button>
      <p class="err" id="login-err" role="alert"></p>
    </form>
  </section>

  <section id="inbox-view" hidden>
    <div class="bar">
      <h1>수업 신청함</h1>
      <button class="btn quiet" type="button" id="logout">잠그기</button>
    </div>
    <div class="count"><strong id="new-count">0</strong>새 신청</div>
    <div class="filters" role="group" aria-label="상태별 보기">
      <button type="button" data-filter="all" aria-pressed="true">전체</button>
      <button type="button" data-filter="새 문의" aria-pressed="false">새 신청</button>
      <button type="button" data-filter="연락함" aria-pressed="false">연락함</button>
      <button type="button" data-filter="완료" aria-pressed="false">완료</button>
    </div>
    <ul class="list" id="list"></ul>
    <p class="empty" id="empty" hidden>아직 들어온 신청이 없어요.</p>
  </section>
  <p class="toast" id="toast" role="status" hidden></p>
</main>

<script>
(function () {
  var KEY = 'macaron-admin-pw';
  var LABEL = { '새 문의': '새 신청', '연락함': '연락함', '완료': '완료' };
  var rows = [], filter = 'all';
  var $ = function (id) { return document.getElementById(id); };

  function getPw() { try { return sessionStorage.getItem(KEY) || ''; } catch (e) { return ''; } }
  function setPw(v) { try { v ? sessionStorage.setItem(KEY, v) : sessionStorage.removeItem(KEY); } catch (e) {} }
  function toast(msg) { var t = $('toast'); t.textContent = msg; t.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(function () { t.hidden = true; }, 2200); }

  async function api(method, body) {
    var r = await fetch('/api/admin', {
      method: method,
      headers: Object.assign({ 'x-admin-password': getPw() }, body ? { 'Content-Type': 'application/json' } : {}),
      body: body ? JSON.stringify(body) : undefined
    });
    var data = await r.json().catch(function () { return {}; });
    return { ok: r.ok, status: r.status, data: data };
  }

  function showLogin(msg) {
    $('inbox-view').hidden = true; $('login-view').hidden = false;
    $('login-err').textContent = msg || '';
    $('pw').value = ''; $('pw').focus();
  }

  async function load() {
    var res = await api('GET');
    if (res.status === 401) { setPw(''); showLogin('비밀번호가 맞지 않아요.'); return; }
    if (!res.ok) { showLogin(res.data.error || '불러오지 못했어요.'); return; }
    rows = res.data.rows || [];
    $('login-view').hidden = true; $('inbox-view').hidden = false;
    render();
  }

  function fmt(iso) {
    var d = new Date(iso);
    return d.toLocaleString('ko-KR', { month: 'long', day: 'numeric', weekday: 'short', hour: '2-digit', minute: '2-digit' });
  }

  function render() {
    $('new-count').textContent = rows.filter(function (r) { return r.status === '새 문의'; }).length;
    var shown = rows.filter(function (r) { return filter === 'all' || r.status === filter; });
    var list = $('list'); list.textContent = '';
    $('empty').hidden = shown.length > 0;
    shown.forEach(function (r) {
      var li = document.createElement('li');
      li.className = 'card' + (r.status === '새 문의' ? ' is-new' : '');
      var when = document.createElement('p'); when.className = 'when'; when.textContent = fmt(r.created_at);
      var who = document.createElement('p'); who.className = 'who'; who.textContent = r.name;
      var c = document.createElement('button'); c.type = 'button'; c.className = 'contact'; c.textContent = r.contact;
      c.addEventListener('click', function () {
        if (navigator.clipboard) navigator.clipboard.writeText(r.contact).then(function () { toast('연락처를 복사했어요.'); }, function () { select(c); });
        else select(c);
      });
      var date = document.createElement('p'); date.className = 'date';
      var b = document.createElement('b'); b.textContent = '원하는 날짜: ';
      date.appendChild(b); date.appendChild(document.createTextNode(r.wish_date || '적지 않음'));
      var states = document.createElement('div'); states.className = 'states'; states.setAttribute('role', 'group'); states.setAttribute('aria-label', '처리 상태');
      ['새 문의', '연락함', '완료'].forEach(function (s) {
        var btn = document.createElement('button'); btn.type = 'button'; btn.textContent = LABEL[s];
        btn.setAttribute('aria-pressed', String(r.status === s));
        btn.addEventListener('click', async function () {
          if (r.status === s) return;
          var res = await api('PATCH', { id: r.id, status: s });
          if (res.status === 401) { setPw(''); showLogin('다시 비밀번호를 넣어 주세요.'); return; }
          if (!res.ok) { toast(res.data.error || '바꾸지 못했어요.'); return; }
          toast('상태를 바꿨어요: ' + LABEL[s]);
          load();
        });
        states.appendChild(btn);
      });
      [when, who, c, date, states].forEach(function (el) { li.appendChild(el); });
      list.appendChild(li);
    });
  }

  function select(el) { var range = document.createRange(); range.selectNodeContents(el); var s = getSelection(); s.removeAllRanges(); s.addRange(range); }

  $('login-form').addEventListener('submit', function (e) {
    e.preventDefault();
    var v = $('pw').value; if (!v) return;
    setPw(v); load();
  });
  $('logout').addEventListener('click', function () { setPw(''); rows = []; showLogin(''); });
  document.querySelectorAll('[data-filter]').forEach(function (b) {
    b.addEventListener('click', function () {
      filter = b.dataset.filter;
      document.querySelectorAll('[data-filter]').forEach(function (o) { o.setAttribute('aria-pressed', String(o === b)); });
      render();
    });
  });

  if (getPw()) load(); else showLogin('');
})();
</script>
</body>
</html>
